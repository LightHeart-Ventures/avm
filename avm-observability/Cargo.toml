[package]
name = "avm-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compatibility shim over `avm-otel` (kept so legacy `avm_observability::init` call sites keep working)."

[features]
default = []
# Forwarded to `avm-otel`. Kept so `--features otlp` still resolves here.
otlp = ["avm-otel/otlp"]

[dependencies]
avm-otel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
