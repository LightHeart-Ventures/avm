syntax = "proto3";

package avm.v1;

// =====================================================================
// AVM (Agent Virtual Machine) control-plane API.
//
// Transport: gRPC (tonic). Async job flow rides NATS JetStream using the
// JobMessage / ResultMessage envelopes defined at the bottom of this file.
// =====================================================================

// ---------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------

message Empty {}

// Scope hierarchy: system -> tenant -> project -> agent.
// A reader at a given level may read its own scope and all ancestors.
message Scope {
  string level = 1;    // "system" | "tenant" | "project" | "agent"
  string tenant_id = 2;
  string project_id = 3;
  string agent_id = 4;
}

message Page {
  uint32 limit = 1;
  string cursor = 2;
}

// ---------------------------------------------------------------------
// Tenant service — CRUD + quota management
// ---------------------------------------------------------------------

service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc UpdateTenantQuotas(UpdateTenantQuotasRequest) returns (Tenant);
  rpc DeleteTenant(DeleteTenantRequest) returns (Empty);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetQuotaUsage(GetQuotaUsageRequest) returns (QuotaUsage);
}

message Tenant {
  string tenant_id = 1;              // "t_abc123"
  string name = 2;
  map<string, string> labels = 3;    // team, environment, billing_code
  QuotaConfig quotas = 4;
  string status = 5;                 // "active" | "suspended"
  string created_at = 6;             // RFC-3339 UTC
  string updated_at = 7;
}

message QuotaConfig {
  uint32 max_concurrent_agents = 1;
  uint64 max_daily_tokens = 2;
  double max_monthly_spend_usd = 3;
  uint32 max_jobs_per_minute = 4;
  repeated string allowed_models = 5;
}

message QuotaUsage {
  string tenant_id = 1;
  string project_id = 2;
  uint32 concurrent_agents = 3;
  uint64 tokens_today = 4;
  double spend_month_usd = 5;
  string window_start = 6;
  string window_end = 7;
}

message CreateTenantRequest {
  string name = 1;
  map<string, string> labels = 2;
  QuotaConfig quotas = 3;
}

message GetTenantRequest { string tenant_id = 1; }
message DeleteTenantRequest { string tenant_id = 1; }

message UpdateTenantQuotasRequest {
  string tenant_id = 1;
  QuotaConfig quotas = 2;
}

message ListTenantsRequest { Page page = 1; }

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_cursor = 2;
}

message GetQuotaUsageRequest {
  string tenant_id = 1;
  string project_id = 2;
}

// ---------------------------------------------------------------------
// Agent service — registration + discovery
// ---------------------------------------------------------------------

service AgentService {
  rpc RegisterAgent(RegisterAgentRequest) returns (Agent);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc DeregisterAgent(DeregisterAgentRequest) returns (Empty);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message Agent {
  string agent_id = 1;               // "ag_xyz789"
  string tenant_id = 2;
  string project_id = 3;
  string name = 4;
  string version = 5;
  string entrypoint = 6;             // local binary path or container image
  string prompt = 7;
  repeated string tools = 8;
  string model = 9;
  AgentPlacement placement = 10;
  string status = 11;                // "registered"|"running"|"failed"|"quarantined"
  string registered_at = 12;
}

message AgentPlacement {
  string pool_id = 1;
  uint32 cpu_millicores = 2;
  uint64 memory_bytes = 3;
  uint32 wall_time_sec = 4;
}

message RegisterAgentRequest {
  string tenant_id = 1;
  string project_id = 2;
  string name = 3;
  string version = 4;
  string entrypoint = 5;
  string prompt = 6;
  repeated string tools = 7;
  string model = 8;
  AgentPlacement placement = 9;
}

message GetAgentRequest { string agent_id = 1; }
message DeregisterAgentRequest { string agent_id = 1; }

message UpdateAgentRequest {
  string agent_id = 1;
  Agent agent = 2;
  repeated string update_mask = 3;
}

message ListAgentsRequest {
  string tenant_id = 1;
  string project_id = 2;
  string status = 3;
  Page page = 4;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_cursor = 2;
}

message HeartbeatRequest {
  string agent_id = 1;
  string executor_id = 2;
  string status = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  uint32 next_interval_sec = 2;
}

// ---------------------------------------------------------------------
// Job service — submit / query / cancel
// ---------------------------------------------------------------------

service JobService {
  rpc SubmitJob(SubmitJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (Job);
  rpc WatchJob(WatchJobRequest) returns (stream JobUpdate);
}

message Job {
  string job_id = 1;                 // "job_abc123"
  Scope scope = 2;
  string agent_id = 3;
  string payload = 4;                // JSON task envelope
  string status = 5;                 // queued|running|succeeded|failed|cancelled
  uint32 priority = 6;               // 0 = highest
  uint32 retry_count = 7;
  uint32 max_retries = 8;
  string last_error = 9;
  string result = 10;
  string created_at = 11;
  string started_at = 12;
  string finished_at = 13;
}

message SubmitJobRequest {
  Scope scope = 1;
  string agent_id = 2;
  string payload = 3;
  uint32 priority = 4;
  uint32 max_retries = 5;
  string idempotency_key = 6;
}

message GetJobRequest { string job_id = 1; }
message CancelJobRequest { string job_id = 1; string reason = 2; }
message WatchJobRequest { string job_id = 1; }

message JobUpdate {
  string job_id = 1;
  string status = 2;
  string message = 3;
  string emitted_at = 4;
}

message ListJobsRequest {
  Scope scope = 1;
  string status = 2;
  string agent_id = 3;
  Page page = 4;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_cursor = 2;
}

// ---------------------------------------------------------------------
// Memory service — read/write with scope-based ACL
// ---------------------------------------------------------------------

service MemoryService {
  rpc WriteMemory(WriteMemoryRequest) returns (Memory);
  rpc ReadMemory(ReadMemoryRequest) returns (Memory);
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (Empty);
}

message Memory {
  string memory_id = 1;
  Scope scope = 2;
  string content = 3;                // <= 32 KB
  repeated string tags = 4;
  string owner_id = 5;
  uint64 ttl_seconds = 6;
  string created_at = 7;
  string updated_at = 8;
}

message WriteMemoryRequest {
  Scope scope = 1;
  string memory_id = 2;              // empty = create, set = upsert
  string content = 3;
  repeated string tags = 4;
  string owner_id = 5;
  uint64 ttl_seconds = 6;
}

// reader_scope is the caller's scope; the server enforces that
// reader_scope may only resolve its own scope and its ancestors.
message ReadMemoryRequest {
  Scope reader_scope = 1;
  Scope target_scope = 2;
  string memory_id = 3;
}

message ListMemoriesRequest {
  Scope reader_scope = 1;
  repeated string tags = 2;
  bool include_inherited = 3;
  Page page = 4;
}

message ListMemoriesResponse {
  repeated Memory memories = 1;
  string next_cursor = 2;
}

message DeleteMemoryRequest {
  Scope reader_scope = 1;
  string memory_id = 2;
}

// ---------------------------------------------------------------------
// Queue envelopes (NATS JetStream)
//   subject: avm.jobs.<tenant_id>.<project_id>
//   results: avm.results.<tenant_id>.<project_id>
// ---------------------------------------------------------------------

message JobMessage {
  string job_id = 1;
  Scope scope = 2;
  string agent_id = 3;
  string payload = 4;
  string created_at = 5;
}

message ResultMessage {
  string job_id = 1;
  string status = 2;                 // "succeeded" | "failed" | "cancelled"
  string result = 3;
  string error = 4;
}

// ---------------------------------------------------------------------
// Tool signatures (JSON-Schema)
//
// Tool contracts are expressed in JSON-Schema (draft 2020-12) and carried
// as serialized strings so they survive the wire byte-for-byte. See
// IMPLEMENTATION_PLAN.md § Tool Schema & Validation.
// ---------------------------------------------------------------------

service ToolService {
  // Full catalog of callable tools + their JSON-Schema signatures.
  rpc ListToolDefinitions(ListToolDefinitionsRequest) returns (ListToolDefinitionsResponse);
  // Check a call against its tool's input schema before dispatching it.
  rpc ValidateToolCall(ValidateToolCallRequest) returns (ToolCallValidation);
}

message ToolDefinition {
  string name = 1;
  // JSON-Schema document for the argument object, serialized.
  string json_schema = 2;
  string description = 3;
  // JSON-Schema document for the result, serialized. Empty when unknown.
  string output_json_schema = 4;
  // MCP server id that owns the tool ("builtin" for gateway-local tools).
  string source_id = 5;
  string transport = 6;              // "builtin" | "stdio" | "http"
  string version = 7;                // server-declared, optional
  // Stable fingerprint of the contract; changes iff the schema changes.
  string fingerprint = 8;
}

message ToolCall {
  string tool_name = 1;
  // Arguments as a serialized JSON object.
  string arguments_json = 2;
  Scope scope = 3;
  string call_id = 4;
}

message ToolCallValidation {
  string tool_name = 1;
  bool valid = 2;
  repeated string errors = 3;
  string schema_fingerprint = 4;
}

message ListToolDefinitionsRequest {
  Scope reader_scope = 1;
  // Optional filter: only tools contributed by these MCP source ids.
  repeated string source_ids = 2;
}

message ListToolDefinitionsResponse {
  repeated ToolDefinition tools = 1;
  string catalog_version = 2;        // "avm.tools/v1"
  string dialect = 3;                // JSON-Schema dialect URI
}

message ValidateToolCallRequest {
  ToolCall call = 1;
}

// ---------------------------------------------------------------------
// A2A (agent-to-agent) + Agent Card
//
// Wire format of record for A2A is JSON over HTTP (see avm-agent and
// docs/A2A_AGENT_CARD.md); these messages are the gRPC mirror for clients
// that would rather speak protobuf to the control plane.
//
//   GET  /.well-known/agent-card.json  -> AgentCard
//   POST /a2a/task                     -> A2ATask / A2AResponse
// ---------------------------------------------------------------------

// Generic key/value pair used by AgentCardResponse for forward-compatible
// passthrough of card fields a client does not yet model.
message Field {
  string key = 1;
  string value = 2;
}

message ModelRef {
  string uri = 1;                    // oci://... | anthropic://... | local://...
  string provider = 2;               // "anthropic" | "openai" | "bedrock" | "oci" | "local"
  string model = 3;
  string digest = 4;                 // set when distributed as an OCI artifact
}

message Capability {
  string name = 1;
  string description = 2;
  string input_schema = 3;           // JSON-Schema document, serialized
  string output_schema = 4;          // JSON-Schema document, serialized
  repeated string tags = 5;
}

message McpServerRef {
  string name = 1;
  string transport = 2;              // "stdio" | "http" | "sse"
  string endpoint = 3;
  repeated string tools = 4;
}

message AuthScheme {
  string type = 1;                   // "none" | "bearer" | "mtls" | "oidc_jwt"
  string issuer = 2;                 // oidc_jwt only
  string audience = 3;               // oidc_jwt only
}

message AuthPolicy {
  repeated AuthScheme schemes = 1;
  repeated string required_scopes = 2;
  repeated string allowed_agents = 3;
  bool allow_anonymous = 4;
}

message AgentCard {
  string schema_version = 1;         // "avm.a2a/v1"
  string agent_id = 2;
  string name = 3;
  string description = 4;
  string version = 5;
  string url = 6;
  Scope scope = 7;
  ModelRef model_ref = 8;
  repeated Capability capabilities = 9;
  repeated McpServerRef mcp_servers = 10;
  AuthPolicy auth_policy = 11;
  repeated Field metadata = 12;
}

// Flat, forward-compatible projection of an AgentCard. `card_json` carries the
// canonical document verbatim so no field is ever lost in translation.
message AgentCardResponse {
  repeated Field fields = 1;
  string schema_version = 2;
  string card_json = 3;
}

message Artifact {
  string name = 1;
  string mime_type = 2;
  string content = 3;                // inline; mutually exclusive with uri
  string uri = 4;
}

message TaskTimeout {
  uint64 seconds = 1;
  string deadline = 2;               // RFC-3339; authoritative when set
}

message TaskContext {
  Scope scope = 1;
  string capability = 2;
  string parent_task_id = 3;
  string correlation_id = 4;
  string input_json = 5;             // validated against capability.input_schema
  repeated Artifact artifacts = 6;
}

message AgentRef {
  string agent_id = 1;
  string name = 2;
  string card_url = 3;
}

message A2ATask {
  string task_id = 1;                // caller-generated idempotency key
  string schema_version = 2;
  AgentRef source_agent = 3;
  string target_agent = 4;
  string instructions = 5;
  TaskContext context = 6;
  TaskTimeout timeout = 7;
  string created_at = 8;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint32 tool_calls = 3;
  uint64 duration_ms = 4;
  uint64 cost_micro_usd = 5;
}

message A2AError {
  string code = 1;                   // see avm_agent::ErrorCode
  string message = 2;
  bool retryable = 3;
}

message TaskResult {
  string content = 1;
  string output_json = 2;
  repeated Artifact artifacts = 3;
}

message A2AResponse {
  string task_id = 1;
  string schema_version = 2;
  string status = 3;                 // accepted|running|succeeded|failed|rejected|timed_out|cancelled
  TaskResult result = 4;
  A2AError error = 5;
  Usage usage = 6;
  string updated_at = 7;
}

message GetAgentCardRequest {
  string agent_id = 1;
}

message GetTaskRequest {
  string task_id = 1;
}

message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message RegisterAgentCardRequest {
  Scope scope = 1;
  AgentCard card = 2;
}

// A2A control surface. The HTTP endpoints on avm-gateway are the primary
// interface; this service is the in-cluster gRPC equivalent.
service A2AService {
  rpc GetAgentCard(GetAgentCardRequest) returns (AgentCardResponse);
  rpc RegisterAgentCard(RegisterAgentCardRequest) returns (AgentCardResponse);
  rpc SubmitTask(A2ATask) returns (A2AResponse);
  rpc GetTask(GetTaskRequest) returns (A2AResponse);
  rpc CancelTask(CancelTaskRequest) returns (A2AResponse);
}
