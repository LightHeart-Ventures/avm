services:
  nats:
    image: nats:latest
    container_name: avm-nats
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    container_name: avm-postgres
    environment:
      POSTGRES_USER: avm
      POSTGRES_PASSWORD: avm
      POSTGRES_DB: avm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avm -d avm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  nats_data:
