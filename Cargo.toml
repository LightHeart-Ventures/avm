[workspace]
resolver = "2"
members = [
    "avm-proto",
    "avm-server",
    "avm-scheduler",
    "avm-executor",
    "avm-gateway",
    "avm-storage",
    "avm-queue",
    "avm-observability",
    "avm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
repository = "https://github.com/LightHeart-Ventures/avm"
authors = ["LightHeart Ventures"]

[workspace.dependencies]
# --- local crates ---
avm-proto = { path = "avm-proto" }
avm-storage = { path = "avm-storage" }
avm-queue = { path = "avm-queue" }
avm-observability = { path = "avm-observability" }

# --- async runtime / rpc ---
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
futures = "0.3"

# --- storage ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# --- queue ---
async-nats = "0.38"

# --- http / mcp gateway ---
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# --- serialization / util ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
